name: awesome-lint

# Enforces the awesome-list structural rules (badge, Contents, item format, no License
# section in the body) on the generated README. A named, required job so "awesome-lint
# passes" is verified, not assumed.

on:
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/awesome-lint.yml"

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes awesome-lint
