name: link-check (PR)

# Gate on contributions: a dead new link fails the PR, and the README must
# stay awesome-lint conformant. See spec §5.1.

on:
  pull_request:
    paths:
      - "README.md"
      - ".lycheeignore"
      - ".github/workflows/link-check-pr.yml"

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links and in-doc anchors
        uses: lycheeverse/lychee-action@v2
        with:
          # --include-fragments anchor-only validates the ToC and the Model
          # Gallery's #slug back-links against the <a id> anchors (spec §5.1, §7.7).
          # token is passed so the many github.com links are checked authenticated,
          # avoiding the 60 req/hr anonymous rate limit that reports live links as dead.
          args: >-
            --include-fragments anchor-only
            --accept 200..=299,429
            --no-progress
            README.md
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # doctoc has no --check flag; --dryrun writes nothing and exits non-zero
      # when the committed ToC is stale (spec §7.8). --title '## Contents' keeps the
      # generated heading matching the awesome manifest.
      - name: Verify Table of Contents is current
        run: npx -y doctoc README.md --title '## Contents' --dryrun

  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Awesome-list manifest conformance
        run: npx -y awesome-lint
